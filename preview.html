<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Animated Profile Banner Preview - Dhruv Bhargava</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #060913;
      color: #F1F5F9;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #22D3EE;
    }
    p {
      margin: 0;
      color: #94A3B8;
      font-size: 14px;
    }
    .banner-container {
      width: 100%;
      max-width: 1180px;
      background: #0A101F;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid #1E293B;
    }
    .banner-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .section-title {
      align-self: flex-start;
      max-width: 1180px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .badge {
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.3);
      color: #22D3EE;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div>
    <h1>Phase 1 — Live Animated Profile Banner</h1>
    <p>Dhruv Bhargava · Full Stack Developer &amp; Data Analyst · Visual Map &amp; SYSTEM.INFO</p>
  </div>

  <div class="section-title">
    <h2>Dark Mode Banner (dark.svg)</h2>
    <span class="badge">1014 KB · SMIL Animated · 14.2s Loop</span>
  </div>
  <div class="banner-container">
    <img src="dark.svg" alt="Dark Mode Animated Banner" />
  </div>

  <div class="section-title" style="margin-top: 20px;">
    <h2>Light Mode Banner (light.svg)</h2>
    <span class="badge">Inverted Shadow Dot Dither</span>
  </div>
  <div class="banner-container" style="background: #F8FAFC; border-color: #E2E8F0;">
    <img src="light.svg" alt="Light Mode Animated Banner" />
  </div>
</body>
</html>
